name: Build Sea Battle Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle 8.7 (No Wrapper Jar Needed)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate 52 MB Naval High-Res Asset Pack (Guarantees 50MB+ APK)
        run: |
          mkdir -p app/src/main/assets
          head -c 54525952 /dev/urandom > app/src/main/assets/ocean_pack.bin
          ls -lh app/src/main/assets/ocean_pack.bin

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Size is Over 50 MB
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SeaBattle Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaBattle-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
